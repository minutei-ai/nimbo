<!doctype html>
<script>
  globalThis.scriptTrace = [];
  globalThis.scriptErrors = [];
  globalThis.scriptLoads = 0;
  addEventListener("error", (event) =>
    scriptErrors.push(event.error.name === "SyntaxError" ? "syntax" : event.error.message),
  );
  addEventListener("load", () => scriptTrace.push("load"));
  document.addEventListener(
    "load",
    (event) => {
      if (event.target.tagName === "SCRIPT") scriptLoads++;
    },
    true,
  );
</script>

  scriptTrace.push("inline");
  throw new Error("inline");
</script>
