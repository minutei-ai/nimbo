[package]
name = "nimbo-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cookie_store = { version = "=0.22.1", default-features = false }
psl = "=2.1.239"
cssparser = "=0.37.0"
dom_query = { version = "=0.28.0", default-features = false }
encoding_rs = "=0.8.42"
icu_casemap = "=2.3.0"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
num-traits = { version = "=0.2.19", default-features = false }
selectors = "=0.38.0"
rquickjs = { version = "=0.14.0", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = { version = "=0.14.0", default-features = false, features = [
  "std",
  "taffy_tree",
  "block_layout",
  "flexbox",
  "grid",
  "parse",
  "content_size",
] }
thiserror = "2"
ttf-parser = "=0.25.1"
url = "=2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
  "socks",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
cookie_store = { version = "=0.22.1", default-features = false, features = ["wasm-bindgen"] }
# Lightning CSS hash maps use the host Web Crypto entropy on Workers.
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tiny_http = "=0.12.0"

[lints]
workspace = true
