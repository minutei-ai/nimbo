[package]
name = "nimbo-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dom_query = { version = "=0.28.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = [
  "blocking",
  "cookies",
  "rustls",
] }
rquickjs = "=0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tiny_http = "=0.12.0"

[lints]
workspace = true
