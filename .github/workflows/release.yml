name: Release

# Publishes the built Worker bundle so deployments pin a reviewed artifact by
# version and SHA-256 instead of building Rust and Wasm themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies and installed tools
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - run: sudo apt-get update && sudo apt-get install -y clang llvm lld
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: bun install --frozen-lockfile
      - run: bun run build:worker
      - name: Package the Worker bundle
        run: |
          tar -czf nimbo-worker.tar.gz -C dist worker
          sha256sum nimbo-worker.tar.gz > nimbo-worker.tar.gz.sha256
      - name: Package the native client and Worker assets
        run: |
          mkdir -p dist/client
          cp packages/client/package.json dist/client/package.json
          cp -R packages/client/src dist/client/src
          cp -R dist/worker dist/client/worker
          cd dist/client
          bun pm pkg set version="${GITHUB_REF_NAME#v}"
          bun pm pack --filename ../nimbo-client.tgz --ignore-scripts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nimbo-worker.tar.gz nimbo-worker.tar.gz.sha256 dist/nimbo-client.tgz \
            --title "$GITHUB_REF_NAME" --notes "Native client package with Worker assets, plus the standalone Worker bundle."
