name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies and installed tools
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: nimbo-rust
      - run: sudo apt-get update && sudo apt-get install -y clang llvm lld python3 openssl
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Compare real HTTP browser behavior with pinned Chromium
        env:
          NIMBO_COMPARE_CHROMIUM_BINARY: /tmp/nimbo-chromium/chrome-linux64/chrome
        run: |
          mkdir -p /tmp/nimbo-chromium
          curl --fail --silent --show-error --location https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/linux64/chrome-linux64.zip -o /tmp/nimbo-chromium/release.zip
          echo '43fd31766c7533a02dda2ded5ad50c2f861cd5400be7509c0abad71129f79d79  /tmp/nimbo-chromium/release.zip' | sha256sum --check
          unzip -q /tmp/nimbo-chromium/release.zip -d /tmp/nimbo-chromium
          /tmp/nimbo-chromium/chrome-linux64/chrome --version
          bun test --parallel=2 tooling/browser-live-*.test.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable history for credentials
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
